name: AI SMM / Cross-platform regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Run the complete matrix on the newest source snapshot only. Historical
# runs remain in GitHub, but superseded commits cannot consume Windows runners.
concurrency:
  group: ai-smm-cross-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: ${{ matrix.os }} / shard ${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [0, 1, 2, 3]
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install native Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install application and QA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r AI_SMM_Work_Architecture_A75/requirements.txt
      - name: Structural and mirror preflight
        run: python ci/verify_tree.py
      - name: Run assigned entire regression shard
        env:
          QT_QPA_PLATFORM: offscreen
        run: python ci/run_regression.py --shards 4 --index ${{ matrix.shard }} --timeout 3300
      - name: Keep evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ runner.os }}-${{ matrix.shard }}
          path: ci_evidence/
          if-no-files-found: warn
          retention-days: 30

  review-transport-contract:
    name: Independent reviewer / offline protocol contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Verify provider failover cannot bypass independent review
        run: python -m unittest discover -s ci -p 'test_*review*.py' -v
      - name: Install image verification dependency for media contracts
        run: python -m pip install "Pillow>=10,<13"
      - name: Verify Kie media models, ownership and crash fencing
        run: python -m unittest discover -s ci -p 'test_kie_media*.py' -v

  regression-gate:
    name: Regression gate / both operating systems
    if: always()
    needs: [regression, review-transport-contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Download all shard evidence
        uses: actions/download-artifact@v4
        with:
          pattern: regression-*
          path: downloaded_evidence
      - name: Reject missing or failed review protocol contract
        env:
          CONTRACT_STATUS: ${{ needs.review-transport-contract.result }}
        run: python -c "import os,sys; sys.exit(0 if os.environ.get('CONTRACT_STATUS') == 'success' else 2)"
      - name: Reject missing or mismatched test evidence
        run: python ci/aggregate_regression.py --input downloaded_evidence
      - name: Keep gate summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aggregate-regression-gate
          path: ci_evidence/aggregate.json
          if-no-files-found: warn
