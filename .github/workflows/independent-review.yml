name: AI SMM / Independent cloud reviews

# SECURITY: pull_request_target runs the review script from the trusted base branch.
# It never checks out or executes code from the proposed PR, only reads its diff.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  actions: write  # Required only to persist PR-scoped cache after a failed audit

# Prevent concurrent paid calls for successive updates to the same PR.
# Cancel superseded reviews before they spend credits or publish stale results.
concurrency:
  group: independent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  independent-review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        provider: [anthropic]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Verify independent reviewer transport and fail-closed contract
        run: python -m unittest discover -s ci -p 'test_*review*.py' -v
      # No billable preflight: the first missing PR segment is itself the live probe.
      # The offline contract tests above verify transport formatting without credits.
      - name: Export PR diff as data, without executing PR code
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --patch > review_input.diff
      - name: Restore verified partial direct Anthropic evidence
        uses: actions/cache/restore@v4
        with:
          path: ci_evidence/review_anthropic.json
          key: anthropic-review-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            anthropic-review-${{ github.event.pull_request.number }}-
      - name: Primary direct Anthropic Claude audit (fail-closed)
        id: primary
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-4-5' }}
        run: python ci/independent_review.py --provider anthropic --diff review_input.diff --output ci_evidence/review_anthropic.json
      - name: Verify full coverage; optional independent provider only after transient outage
        env:
          PRIMARY_REVIEW_PROVIDER: anthropic
          ALT_REVIEW_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALT_REVIEW_API_URL: ${{ vars.ALT_REVIEW_API_URL }}
          # Gemini 2.5 Pro returns 404 for newly provisioned accounts.
          # Google's 404 response recommends gemini-3.1-pro-preview.
          ALT_REVIEW_MODEL: gemini-3.1-pro-preview
        run: python ci/review_provider_gate.py --diff review_input.diff --primary ci_evidence/review_anthropic.json --backup ci_evidence/review_compatible.json --output ci_evidence/review_gate.json
      - name: Save reviewed direct Anthropic segments for safe continuation
        if: ${{ always() && hashFiles('ci_evidence/review_anthropic.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: ci_evidence/review_anthropic.json
          key: anthropic-review-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-review-${{ matrix.provider }}
          path: |
            ci_evidence/review_anthropic.json
            ci_evidence/review_compatible.json
            ci_evidence/review_gate.json
          if-no-files-found: warn
          retention-days: 30
