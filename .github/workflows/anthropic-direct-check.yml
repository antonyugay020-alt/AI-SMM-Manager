name: AI SMM / Anthropic direct connection (one-time)

# One bounded diagnostic on workflow update; ordinary pushes do not spend credits.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/anthropic-direct-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anthropic-direct:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Validate independent reviewer transport (offline)
        run: python -m unittest discover -s ci -p 'test_*review*.py' -v
      - name: Validate model inventory selection without external requests
        run: python -m unittest discover -s ci -p 'test_anthropic_model_inventory.py' -v
      - name: One bounded direct Anthropic request
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-5-5
        run: python ci/anthropic_direct_smoke.py
      - name: Retain sanitized outcome even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anthropic-direct-smoke
          path: ci_evidence/anthropic_direct_status.json
          if-no-files-found: warn
          retention-days: 7
