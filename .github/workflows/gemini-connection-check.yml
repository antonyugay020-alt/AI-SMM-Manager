name: AI SMM / Gemini direct connection (one-time)

# Verify the Google-recommended replacement model after deprecated 2.5 returned 404.
# Later ordinary code pushes must not spend Gemini API credits.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/gemini-connection-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gemini-connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Verify diagnostic redaction without secrets or API calls
        run: python -m unittest discover -s ci -p 'test_gemini_error_safety.py' -v
      - name: Probe Google Gemini Pro direct API (one small synthetic request)
        env:
          ALT_REVIEW_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALT_REVIEW_API_URL: ${{ vars.ALT_REVIEW_API_URL }}
          # The originally configured gemini-2.5-pro is no longer available to new users.
          ALT_REVIEW_MODEL: gemini-3.1-pro-preview
        run: python ci/gemini_review_smoke.py
      - name: Save sanitized provider status, including failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-direct-connection-status
          path: ci_evidence/gemini_probe.json
          retention-days: 7
          if-no-files-found: warn
